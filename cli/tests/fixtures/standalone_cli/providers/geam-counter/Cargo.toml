[package]
name = "geam-counter"
version = "1.0.0"
edition = "2024"
description = "Stateful provider for the standalone Geam fixture"
license = "Apache-2.0"
repository = "https://github.com/panarch/geam"

[package.metadata.geam.provider]
schema = 1
gleam-package = "counter"
gleam-version = ">= 1.0.0 and < 2.0.0"

[dependencies]
geam = { version = "=0.2.1", default-features = false, features = ["provider"] }
