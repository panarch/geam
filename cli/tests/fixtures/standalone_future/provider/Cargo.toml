[package]
name = "geam-standalone-future-test"
version = "1.0.0"
edition = "2024"
publish = false
description = "Tokio-dependent standalone execution acceptance fixture"
license = "Apache-2.0"

[package.metadata.geam.provider]
schema = 1
gleam-package = "standalone_future"
gleam-version = ">= 1.0.0 and < 2.0.0"

[dependencies]
geam = { version = "=0.2.3", default-features = false, features = ["provider"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }

[patch.crates-io]
geam = { path = "../../../../.." }

[workspace]
resolver = "3"
