name: Workspace

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
          rustflags: ""

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check standalone provider formatting
        working-directory: cli/tests/fixtures/standalone_cli/providers
        run: cargo fmt --all --check

      - name: Check example provider formatting
        run: |
          for example in text_tools value_types tag_set request_ids feature_flags run_metrics call_tracing generic_box text_pattern; do
            (cd "examples/provider/$example/provider" && cargo fmt --all --check)
          done

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            cli/tests/fixtures/standalone_cli/providers -> target
            examples/provider/text_tools/provider -> target
            examples/provider/value_types/provider -> target
            examples/provider/tag_set/provider -> target
            examples/provider/request_ids/provider -> target
            examples/provider/feature_flags/provider -> target
            examples/provider/run_metrics/provider -> target
            examples/provider/call_tracing/provider -> target
            examples/provider/generic_box/provider -> target
            examples/provider/text_pattern/provider -> target

      - name: Fetch standalone provider dependencies
        working-directory: cli/tests/fixtures/standalone_cli/providers
        run: cargo fetch --locked --config net.offline=false

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run standalone provider clippy
        working-directory: cli/tests/fixtures/standalone_cli/providers
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run example provider clippy
        run: |
          for example in text_tools value_types tag_set request_ids feature_flags run_metrics call_tracing generic_box text_pattern; do
            (cd "examples/provider/$example/provider" && cargo clippy --all-targets --locked -- -D warnings)
          done

  documentation:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build workspace documentation
        run: cargo doc --workspace --no-deps --locked

  zensical:
    name: Zensical
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build documentation site
        run: uvx --from zensical==0.0.50 zensical build --clean --strict

  workspace-tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check documented compiler pin
        shell: bash
        run: |
          version=$(cargo metadata --locked --format-version 1 | jq -er '
            [.packages[] | select(.name == "geam-gleam-core") | .version] |
            if length == 1 then .[0]
            else error("expected exactly one geam-gleam-core package") end
          ')
          if ! grep -Fxq "Cargo:      geam-gleam-core $version" docs/development/upstream-gleam.md; then
            echo "::error file=docs/development/upstream-gleam.md::Expected compiler pin geam-gleam-core $version; review the upstream baseline manually."
            exit 1
          fi

      - name: Check root feature profiles
        run: |
          cargo check --package geam --no-default-features --features embedding --all-targets --locked
          cargo check --package geam --no-default-features --features provider --all-targets --locked
          cargo check --package geam --no-default-features --features embedding,gleam-stdlib --all-targets --locked

      - name: Test workspace packages
        run: cargo test --workspace --exclude geam --locked

      - name: Assemble workspace packages
        run: cargo package --workspace --locked --no-verify
