name: Acceptance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  root-acceptance:
    name: Root package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Test root acceptance boundaries
        run: |
          cargo test --package geam --test binary --locked
          cargo test --package geam --test cross_crate_http --locked
          cargo test --package geam --test standalone_distribution --locked

      - name: Verify standalone provider packages
        working-directory: cli/tests/fixtures/standalone_cli/providers
        run: |
          cargo package --quiet --offline --allow-dirty --no-verify --locked --package geam-catalog
          cargo package --quiet --offline --allow-dirty --no-verify --locked --package geam-counter

      - name: Verify standalone Gleam packages
        run: |
          for package in catalog counter pure_labels; do
            (cd "cli/tests/fixtures/standalone_cli/project/packages/$package" && gleam export hex-tarball)
          done

  rust-embedding:
    name: Rust embedding
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/rust_embedding_application -> target

      - name: Verify application dependency graph
        run: |
          cargo tree --manifest-path examples/rust_embedding_application/Cargo.toml --locked --package geam --edges normal --depth 1 --prefix none > "$RUNNER_TEMP/geam-embedding-graph"
          cat "$RUNNER_TEMP/geam-embedding-graph"
          test "$(grep -Ec '^geam v' "$RUNNER_TEMP/geam-embedding-graph")" -eq 1
          for package in geam-core geam-macros geam-stdlib; do
            grep -Eq "^${package} v" "$RUNNER_TEMP/geam-embedding-graph"
          done
          if grep -Eq '^geam-(cli|json|time) v' "$RUNNER_TEMP/geam-embedding-graph"; then
            echo "unexpected Geam dependency in the Rust embedding profile" >&2
            exit 1
          fi
          cargo tree --manifest-path examples/rust_embedding_application/Cargo.toml --locked --package geam-rust-embedding-application --edges normal --depth 1 --prefix none > "$RUNNER_TEMP/application-embedding-graph"
          grep -Eq '^geam-example-text-pattern v' "$RUNNER_TEMP/application-embedding-graph"

      - name: Install checkout CLI
        run: cargo install --path . --locked --root "$RUNNER_TEMP/checkout-geam"

      - name: Check manual embedding formatting
        working-directory: examples/rust_embedding
        run: gleam format --check

      - name: Run manual embedding example
        run: |
          cat > "$RUNNER_TEMP/expected-manual-embedding-output" <<'EOF'
          code: SKU:AB-12
          quantity: 42
          price: 12.5
          EOF
          cargo run --quiet --package geam --example rust_embedding --locked > "$RUNNER_TEMP/actual-manual-embedding-output"
          diff --unified "$RUNNER_TEMP/expected-manual-embedding-output" "$RUNNER_TEMP/actual-manual-embedding-output"

      - name: Verify locked readiness and binding drift recovery
        working-directory: examples/rust_embedding_application
        run: |
          "$RUNNER_TEMP/checkout-geam/bin/geam" embedding check
          git diff --exit-code -- .
          printf '\n// stale acceptance probe\n' >> src/geam_bindings.rs
          if "$RUNNER_TEMP/checkout-geam/bin/geam" embedding check; then
            echo "embedding check accepted stale generated source" >&2
            exit 1
          fi
          "$RUNNER_TEMP/checkout-geam/bin/geam" embedding sync
          "$RUNNER_TEMP/checkout-geam/bin/geam" embedding check
          git diff --exit-code -- .

      - name: Check application formatting
        run: |
          (cd examples/rust_embedding_application/gleam && gleam format --check)
          cargo fmt --manifest-path examples/rust_embedding_application/Cargo.toml --all --check

      - name: Test application
        run: cargo test --manifest-path examples/rust_embedding_application/Cargo.toml --locked

      - name: Run application clippy
        run: cargo clippy --manifest-path examples/rust_embedding_application/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run application
        run: |
          cat > "$RUNNER_TEMP/expected-embedding-output" <<'EOF'
          validating inventory
          Inventory validation:
            AB-12: 3
            Row 2 rejected: invalid code
            C-7: 4
            Row 4 rejected: quantity must not be negative
          Total quantity: 7
          First valid item: AB-12 (3)
          EOF
          cargo run --quiet --manifest-path examples/rust_embedding_application/Cargo.toml --locked > "$RUNNER_TEMP/actual-embedding-output"
          diff --unified "$RUNNER_TEMP/expected-embedding-output" "$RUNNER_TEMP/actual-embedding-output"

  published-provider:
    name: Published provider
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEAM_VERSION: "0.2.1"
      GLEAM_PACKAGE_VERSION: "0.1.0"
      PROVIDER_VERSION: "0.1.0"

    steps:
      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"
          cache: false
          rustflags: ""

      - name: Install published Geam
        run: |
          cargo install geam --version "=$GEAM_VERSION" --locked --root "$RUNNER_TEMP/published-geam"
          test "$("$RUNNER_TEMP/published-geam/bin/geam" --version)" = "geam $GEAM_VERSION"

      - name: Create clean Gleam project
        run: gleam new --name published_provider --skip-git --skip-github "$RUNNER_TEMP/published-provider"

      - name: Add published Gleam package
        working-directory: ${{ runner.temp }}/published-provider
        run: |
          gleam add "example_text_pattern@$GLEAM_PACKAGE_VERSION"
          sed -i.bak "s/^example_text_pattern = .*/example_text_pattern = \"$GLEAM_PACKAGE_VERSION\"/" gleam.toml
          rm gleam.toml.bak
          grep -Fx "example_text_pattern = \"$GLEAM_PACKAGE_VERSION\"" gleam.toml
          gleam deps download
          grep -E "name = \"example_text_pattern\", version = \"$GLEAM_PACKAGE_VERSION\".*source = \"hex\"" manifest.toml

      - name: Write provider-backed entry module
        working-directory: ${{ runner.temp }}/published-provider
        run: |
          cat > src/published_provider.gleam <<'GLEAM'
          import example_text_pattern as pattern

          pub fn main() -> Nil {
            let assert Ok(words) = pattern.compile("[A-Za-z]+")
            assert pattern.is_match(words, "Geam + Gleam 2026")
            assert pattern.find_all(words, "Geam + Gleam 2026") == ["Geam", "Gleam"]
            assert pattern.replace_all(words, "Geam + Gleam 2026", "<word>")
              == "<word> + <word> 2026"
            let assert Error(pattern.CompileError(message)) = pattern.compile("(")
            assert message != ""
          }
          GLEAM

      - name: Approve discovered crates.io provider
        working-directory: ${{ runner.temp }}/published-provider
        run: |
          test ! -e Cargo.toml
          printf 'y\n' | script --quiet --return --command "$RUNNER_TEMP/published-geam/bin/geam prepare" "$RUNNER_TEMP/provider-approval.log"
          test "$(grep -Fc "Approve geam-example-text-pattern $PROVIDER_VERSION? [y/N]" "$RUNNER_TEMP/provider-approval.log")" -eq 1

      - name: Verify published provider selection
        working-directory: ${{ runner.temp }}/published-provider
        run: |
          cargo metadata --format-version 1 --locked --manifest-path Cargo.toml > "$RUNNER_TEMP/provider-metadata.json"
          jq -e --arg manifest "$RUNNER_TEMP/published-provider/Cargo.toml" --arg version "$PROVIDER_VERSION" '
            [
              .packages[]
              | select(.manifest_path == $manifest)
              | .dependencies[]
              | select(
                  .rename == "geam_provider_example_text_pattern"
                  and .name == "geam-example-text-pattern"
                  and .req == ("=" + $version)
                  and .path == null
                  and (.source | startswith("registry+"))
                )
            ]
            | length == 1
          ' "$RUNNER_TEMP/provider-metadata.json"
          jq -e --arg geam "$GEAM_VERSION" --arg provider "$PROVIDER_VERSION" '
            ([
              .packages[]
              | select(
                  .name == "geam"
                  and .version == $geam
                  and (.source | startswith("registry+"))
                )
            ] | length == 1)
            and
            ([
              .packages[]
              | select(
                  .name == "geam-example-text-pattern"
                  and .version == $provider
                  and (.source | startswith("registry+"))
                )
            ] | length == 1)
          ' "$RUNNER_TEMP/provider-metadata.json"
          grep -F "geam_provider_example_text_pattern::Component" build/geam/runner.rs
          sha256sum Cargo.toml Cargo.lock build/geam/runner.rs > "$RUNNER_TEMP/provider-files.before"

      - name: Run and repeat published project
        working-directory: ${{ runner.temp }}/published-provider
        run: |
          test -z "$("$RUNNER_TEMP/published-geam/bin/geam" run)"
          "$RUNNER_TEMP/published-geam/bin/geam" prepare
          test -z "$("$RUNNER_TEMP/published-geam/bin/geam" run)"
          sha256sum Cargo.toml Cargo.lock build/geam/runner.rs > "$RUNNER_TEMP/provider-files.after"
          diff --unified "$RUNNER_TEMP/provider-files.before" "$RUNNER_TEMP/provider-files.after"

  example-providers:
    name: Provider examples (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: text_tools
            test: runs_the_documented_text_tools_provider_across_three_modules
          - example: value_types
            test: runs_the_documented_value_types_provider_without_configuration
          - example: tag_set
            test: runs_the_documented_tag_set_provider_without_configuration
          - example: request_ids
            test: runs_the_documented_request_ids_provider_with_fresh_default_state
          - example: feature_flags
            test: runs_the_documented_feature_flags_provider_with_explicit_configuration
          - example: run_metrics
            test: runs_the_documented_run_metrics_provider_without_configuration
          - example: call_tracing
            test: runs_the_documented_call_tracing_provider_with_fresh_callback_state
          - example: generic_box
            test: runs_the_documented_generic_box_provider_with_persistent_values
          - example: text_pattern
            test: runs_the_documented_text_pattern_on_erlang_and_geam
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.example }}
          workspaces: |
            . -> target
            examples/${{ matrix.example }}/provider -> ../../../target

      - name: Run documented provider example
        run: cargo test --package geam --test provider_examples --locked -- --exact "${{ matrix.test }}"

      - name: Test example provider
        working-directory: examples/${{ matrix.example }}/provider
        run: cargo test --locked

      - name: Verify example provider package
        working-directory: examples/${{ matrix.example }}/provider
        run: cargo package --locked

      - name: Verify example Gleam package
        working-directory: examples/${{ matrix.example }}/project/packages/example_${{ matrix.example }}
        run: gleam export hex-tarball

  external-provider-sdk:
    name: External provider SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tests/fixtures/provider_sdk -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Check fixture formatting
        run: cargo fmt --manifest-path tests/fixtures/provider_sdk/Cargo.toml --all --check

      - name: Run fixture tests
        run: cargo test --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --locked

      - name: Run fixture clippy
        run: cargo clippy --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Check fixture coverage
        run: cargo llvm-cov --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --locked --summary-only --fail-under-lines 100 --fail-under-regions 100
