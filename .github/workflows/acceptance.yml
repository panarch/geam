name: Acceptance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  root-acceptance:
    name: Root package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Test root acceptance boundaries
        run: |
          cargo test --package geam --test binary --locked
          cargo test --package geam --test cross_crate_http --locked
          cargo test --package geam --test standalone_distribution --locked

      - name: Verify standalone provider packages
        working-directory: cli/tests/fixtures/standalone_cli/providers
        run: |
          cargo package --quiet --offline --allow-dirty --no-verify --locked --package geam-catalog
          cargo package --quiet --offline --allow-dirty --no-verify --locked --package geam-counter

      - name: Verify standalone Gleam packages
        run: |
          for package in catalog counter pure_labels; do
            (cd "cli/tests/fixtures/standalone_cli/project/packages/$package" && gleam export hex-tarball)
          done

  example-providers:
    name: Provider examples (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: text_tools
            test: runs_the_documented_text_tools_provider_across_three_modules
          - example: value_types
            test: runs_the_documented_value_types_provider_without_configuration
          - example: tag_set
            test: runs_the_documented_tag_set_provider_without_configuration
          - example: request_ids
            test: runs_the_documented_request_ids_provider_with_fresh_default_state
          - example: feature_flags
            test: runs_the_documented_feature_flags_provider_with_explicit_configuration
          - example: run_metrics
            test: runs_the_documented_run_metrics_provider_without_configuration
          - example: call_tracing
            test: runs_the_documented_call_tracing_provider_with_fresh_callback_state
          - example: generic_box
            test: runs_the_documented_generic_box_provider_with_persistent_values
          - example: text_pattern
            test: runs_the_documented_text_pattern_on_erlang_and_geam
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.example }}
          workspaces: |
            . -> target
            examples/${{ matrix.example }}/provider -> ../../../target

      - name: Run documented provider example
        run: cargo test --package geam --test provider_examples --locked -- --exact "${{ matrix.test }}"

      - name: Test example provider
        working-directory: examples/${{ matrix.example }}/provider
        run: cargo test --locked

      - name: Verify example provider package
        working-directory: examples/${{ matrix.example }}/provider
        run: cargo package --locked

      - name: Verify example Gleam package
        working-directory: examples/${{ matrix.example }}/project/packages/example_${{ matrix.example }}
        run: gleam export hex-tarball

  external-provider-sdk:
    name: External provider SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tests/fixtures/provider_sdk -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Check fixture formatting
        run: cargo fmt --manifest-path tests/fixtures/provider_sdk/Cargo.toml --all --check

      - name: Run fixture tests
        run: cargo test --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --locked

      - name: Run fixture clippy
        run: cargo clippy --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Check fixture coverage
        run: cargo llvm-cov --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --locked --summary-only --fail-under-lines 100 --fail-under-regions 100
