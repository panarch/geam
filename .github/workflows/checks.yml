name: Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
          rustflags: ""

      - name: Check formatting
        run: cargo fmt --check

      - name: Check standalone provider formatting
        working-directory: tests/fixtures/standalone_cli/providers
        run: cargo fmt --all --check

      - name: Check provider authoring example formatting
        working-directory: examples/text_pattern/provider
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/fixtures/standalone_cli/providers -> target
            examples/text_pattern/provider -> target

      - name: Fetch standalone provider dependencies
        working-directory: tests/fixtures/standalone_cli/providers
        run: cargo fetch --locked --config net.offline=false

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run standalone provider clippy
        working-directory: tests/fixtures/standalone_cli/providers
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run provider authoring example clippy
        working-directory: examples/text_pattern/provider
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/fixtures/standalone_cli/providers -> target
            examples/text_pattern/provider -> target

      - name: Run tests
        run: cargo test --locked

      - name: Verify standalone provider packages
        working-directory: tests/fixtures/standalone_cli/providers
        run: |
          cargo package --quiet --offline --allow-dirty --no-verify --locked --package geam-catalog
          cargo package --quiet --offline --allow-dirty --no-verify --locked --package geam-counter

      - name: Verify provider authoring example package
        working-directory: examples/text_pattern/provider
        run: cargo package --locked

      - name: Verify standalone Gleam packages
        run: |
          for package in catalog counter pure_labels; do
            (cd "tests/fixtures/standalone_cli/project/packages/$package" && gleam export hex-tarball)
          done

  external-provider-sdk:
    name: External Provider SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tests/fixtures/provider_sdk -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Check fixture formatting
        run: cargo fmt --manifest-path tests/fixtures/provider_sdk/Cargo.toml --all --check

      - name: Run fixture tests
        run: cargo test --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --locked

      - name: Run fixture clippy
        run: cargo clippy --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Check fixture coverage
        run: cargo llvm-cov --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --locked --summary-only --fail-under-lines 100 --fail-under-regions 100

  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/fixtures/standalone_cli/providers -> target
            examples/text_pattern/provider -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Check coverage
        run: cargo llvm-cov --locked --summary-only --fail-under-lines 100 --fail-under-regions 100
