name: Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
          rustflags: ""

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check standalone provider formatting
        working-directory: tests/fixtures/standalone_cli/providers
        run: cargo fmt --all --check

      - name: Check example provider formatting
        run: |
          for example in text_tools value_types tag_set request_ids feature_flags run_metrics call_tracing text_pattern; do
            (cd "examples/$example/provider" && cargo fmt --all --check)
          done

  clippy:
    name: clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/fixtures/standalone_cli/providers -> target
            examples/text_tools/provider -> target
            examples/value_types/provider -> target
            examples/tag_set/provider -> target
            examples/request_ids/provider -> target
            examples/feature_flags/provider -> target
            examples/run_metrics/provider -> target
            examples/call_tracing/provider -> target
            examples/text_pattern/provider -> target

      - name: Fetch standalone provider dependencies
        working-directory: tests/fixtures/standalone_cli/providers
        run: cargo fetch --locked --config net.offline=false

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run standalone provider clippy
        working-directory: tests/fixtures/standalone_cli/providers
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run example provider clippy
        run: |
          for example in text_tools value_types tag_set request_ids feature_flags run_metrics call_tracing text_pattern; do
            (cd "examples/$example/provider" && cargo clippy --all-targets --locked -- -D warnings)
          done

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/fixtures/standalone_cli/providers -> target
            examples/text_tools/provider -> target
            examples/value_types/provider -> target
            examples/tag_set/provider -> target
            examples/request_ids/provider -> target
            examples/feature_flags/provider -> target
            examples/run_metrics/provider -> target
            examples/call_tracing/provider -> target
            examples/text_pattern/provider -> target

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Assemble workspace packages
        run: cargo package --workspace --locked --no-verify

      - name: Verify standalone provider packages
        working-directory: tests/fixtures/standalone_cli/providers
        run: |
          cargo package --quiet --offline --allow-dirty --no-verify --locked --package geam-catalog
          cargo package --quiet --offline --allow-dirty --no-verify --locked --package geam-counter

      - name: Test and package example providers
        run: |
          for example in text_tools value_types tag_set request_ids feature_flags run_metrics call_tracing text_pattern; do
            (cd "examples/$example/provider" && cargo test --locked)
            (cd "examples/$example/provider" && cargo package --locked)
          done

      - name: Verify example Gleam packages
        run: |
          for package in \
            text_tools/example_text_tools \
            value_types/example_value_types \
            tag_set/example_tag_set \
            request_ids/example_request_ids \
            feature_flags/example_feature_flags \
            run_metrics/example_run_metrics \
            call_tracing/example_call_tracing \
            text_pattern/example_text_pattern
          do
            example="${package%%/*}"
            gleam_package="${package#*/}"
            (cd "examples/$example/project/packages/$gleam_package" && gleam export hex-tarball)
          done

      - name: Verify standalone Gleam packages
        run: |
          for package in catalog counter pure_labels; do
            (cd "tests/fixtures/standalone_cli/project/packages/$package" && gleam export hex-tarball)
          done

  external-provider-sdk:
    name: External Provider SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tests/fixtures/provider_sdk -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Check fixture formatting
        run: cargo fmt --manifest-path tests/fixtures/provider_sdk/Cargo.toml --all --check

      - name: Run fixture tests
        run: cargo test --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --locked

      - name: Run fixture clippy
        run: cargo clippy --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Check fixture coverage
        run: cargo llvm-cov --manifest-path tests/fixtures/provider_sdk/Cargo.toml --workspace --locked --summary-only --fail-under-lines 100 --fail-under-regions 100

  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/fixtures/standalone_cli/providers -> target
            examples/text_tools/provider -> target
            examples/value_types/provider -> target
            examples/tag_set/provider -> target
            examples/request_ids/provider -> target
            examples/feature_flags/provider -> target
            examples/run_metrics/provider -> target
            examples/call_tracing/provider -> target
            examples/text_pattern/provider -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Check coverage
        run: cargo llvm-cov --workspace --locked --summary-only --fail-under-lines 100 --fail-under-regions 100
