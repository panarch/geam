name: Coverage

on:
  workflow_dispatch:
    inputs:
      target:
        description: Coverage group to run
        required: true
        type: choice
        default: core-macros
        options:
          - core-macros
          - built-ins
          - cli-binary
          - benchmark
          - application-arguments
          - process_service
          - original_otp
          - charlist_service
          - dict_service
          - bytes_tree_service
          - selective_receive_service
          - application_exit
          - raw_string_values
          - all
      diagnostics:
        description: Upload detailed coverage reports
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-macros-coverage:
    name: Core and macros
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'core-macros' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Clean workspace coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Run core and macro owner tests
        id: collect
        run: cargo llvm-cov --no-report --package geam-core --package geam-macros --features geam-core/tokio --locked

      - name: Check geam-core coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --package geam-core --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Check geam-macros coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --package geam-macros --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Export coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        working-directory: .
        env:
          COVERAGE_PACKAGES: geam-core geam-macros
        # Share only the commands; each job declares its report scope above run.
        run: &coverage_diagnostics |
          set -euo pipefail
          report_directory="$RUNNER_TEMP/coverage-diagnostics"
          mkdir -p "$report_directory"
          export CARGO_TERM_COLOR=never

          {
            printf 'Checkout: '
            git rev-parse HEAD
            printf 'Workspace: %s\n' "$PWD"
            uname -a
            rustc --version --verbose
            cargo --version --verbose
            cargo llvm-cov --version
          } > "$report_directory/toolchain.txt" 2>&1

          printf 'Package\tReport\tExit status\n' > "$report_directory/reports.tsv"
          read -r -a packages <<< "$COVERAGE_PACKAGES"
          status=0
          for package in "${packages[@]}"; do
            package_directory="$report_directory/$package"
            mkdir -p "$package_directory"
            report=(report)
            # "default" keeps an independent consumer's existing report scope.
            if [[ "$package" != default ]]; then
              report+=(--package "$package")
            fi

            if cargo llvm-cov "${report[@]}" --json --summary-only \
              --output-path "$package_directory/summary.json" \
              > "$package_directory/summary.log" 2>&1; then
              printf '%s\tsummary\t0\n' "$package" >> "$report_directory/reports.tsv"
            else
              code=$?
              printf '%s\tsummary\t%s\n' "$package" "$code" >> "$report_directory/reports.tsv"
              cat "$package_directory/summary.log" >&2
              status=1
            fi

            if cargo llvm-cov "${report[@]}" --text --show-instantiations \
              --output-dir "$package_directory" --verbose \
              > "$package_directory/text.log" 2>&1; then
              printf '%s\ttext\t0\n' "$package" >> "$report_directory/reports.tsv"
            else
              code=$?
              printf '%s\ttext\t%s\n' "$package" "$code" >> "$report_directory/reports.tsv"
              cat "$package_directory/text.log" >&2
              status=1
            fi

            if cargo llvm-cov "${report[@]}" --summary-only --show-missing-lines \
              > "$package_directory/missing-lines.txt" 2>&1; then
              printf '%s\tmissing-lines\t0\n' "$package" >> "$report_directory/reports.tsv"
            else
              code=$?
              printf '%s\tmissing-lines\t%s\n' "$package" "$code" >> "$report_directory/reports.tsv"
              cat "$package_directory/missing-lines.txt" >&2
              status=1
            fi
          done

          exit "$status"

      - name: Upload coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core-macros-${{ github.sha }}
          path: ${{ runner.temp }}/coverage-diagnostics
          if-no-files-found: error
          retention-days: 7

  built-in-coverage:
    name: Built-ins
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'built-ins' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Clean workspace coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Run built-in coverage closure
        id: collect
        run: cargo llvm-cov --no-report --package geam-stdlib --package geam-json --package geam-time --package geam-builtin --package geam-erlang --locked

      - name: Check geam-erlang coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --package geam-erlang --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Check geam-builtin coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --package geam-builtin --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Check geam-stdlib coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --package geam-stdlib --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Check geam-json coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --package geam-json --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Check geam-time coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --package geam-time --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Export coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        working-directory: .
        env:
          COVERAGE_PACKAGES: >-
            geam-erlang geam-builtin geam-stdlib geam-json geam-time
        run: *coverage_diagnostics

      - name: Upload coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-built-ins-${{ github.sha }}
          path: ${{ runner.temp }}/coverage-diagnostics
          if-no-files-found: error
          retention-days: 7

  cli-binary-coverage:
    name: CLI and binary
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'cli-binary' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Fetch workspace dependencies for offline fixtures
        run: cargo fetch --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Clean workspace coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Run CLI and binary coverage closure
        id: collect
        run: |
          cargo llvm-cov --no-report --package geam-cli --locked
          cargo llvm-cov --no-clean --package geam --lib --test binary --locked --summary-only

      - name: Check geam-cli coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --package geam-cli --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Check geam binary coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --package geam --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Export coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        working-directory: .
        env:
          COVERAGE_PACKAGES: geam-cli geam
        run: *coverage_diagnostics

      - name: Upload coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cli-binary-${{ github.sha }}
          path: ${{ runner.temp }}/coverage-diagnostics
          if-no-files-found: error
          retention-days: 7

  benchmark-coverage:
    name: Benchmark tooling
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'benchmark' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: benchmarks/.node-version
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-tooling
          workspaces: |
            . -> target
            benchmarks -> target

      - name: Fetch benchmark dependencies
        run: cargo fetch --manifest-path benchmarks/Cargo.toml --locked

      - name: Build checkout CLI without coverage instrumentation
        run: cargo build --package geam --bin geam --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Clean independent benchmark coverage artifacts
        run: cargo llvm-cov clean --manifest-path benchmarks/Cargo.toml --workspace

      - name: Run benchmark coverage closure
        id: collect
        run: cargo llvm-cov --manifest-path benchmarks/Cargo.toml --workspace --no-report --locked

      - name: Check geam-bench coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --manifest-path benchmarks/Cargo.toml --package geam-bench --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Check geam-benchmark-support coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --manifest-path benchmarks/Cargo.toml --package geam-benchmark-support --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Export coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        working-directory: benchmarks
        env:
          COVERAGE_PACKAGES: geam-bench geam-benchmark-support
        run: *coverage_diagnostics

      - name: Upload coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/coverage-diagnostics
          if-no-files-found: error
          retention-days: 7

  application-arguments-coverage:
    name: Application arguments
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'application-arguments' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/tests/fixtures/standalone_cli/providers

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache independent provider build
        uses: Swatinem/rust-cache@v2
        with:
          key: application-arguments
          workspaces: "cli/tests/fixtures/standalone_cli/providers -> target"

      - name: Fetch locked provider dependencies
        run: cargo fetch --locked --config net.offline=false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Clean independent provider coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Collect application argument provider coverage
        id: collect
        run: cargo llvm-cov --package geam-arguments-fixture --no-report --locked

      - name: Check application argument provider coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: cargo llvm-cov report --package geam-arguments-fixture --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Export coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        working-directory: cli/tests/fixtures/standalone_cli/providers
        env:
          COVERAGE_PACKAGES: geam-arguments-fixture
        run: *coverage_diagnostics

      - name: Upload coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-application-arguments-${{ github.sha }}
          path: ${{ runner.temp }}/coverage-diagnostics
          if-no-files-found: error
          retention-days: 7

  service-consumer-coverage:
    name: Service consumer (${{ matrix.consumer }})
    if: >-
      ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all'
          || contains(fromJSON('[
            "process_service",
            "original_otp",
            "charlist_service",
            "dict_service",
            "bytes_tree_service",
            "selective_receive_service",
            "application_exit",
            "raw_string_values"
          ]'), inputs.target) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: >-
          ${{ fromJSON(
            github.event_name == 'workflow_dispatch' && inputs.target != 'all'
            && format('["{0}"]', inputs.target)
            || '[
              "process_service",
              "original_otp",
              "charlist_service",
              "dict_service",
              "bytes_tree_service",
              "selective_receive_service",
              "application_exit",
              "raw_string_values"
            ]'
          ) }}
    env:
      CONSUMER_DIRECTORY: >-
        ${{ fromJSON('{
          "process_service": "examples/provider/process_service/provider",
          "original_otp": "tests/fixtures/otp_service/provider",
          "charlist_service": "tests/fixtures/charlist_service/provider",
          "dict_service": "tests/fixtures/dict_service/provider",
          "bytes_tree_service": "tests/fixtures/bytes_tree_service/provider",
          "selective_receive_service": "tests/fixtures/selective_receive_service/provider",
          "application_exit": "tests/fixtures/application_exit/provider",
          "raw_string_values": "tests/fixtures/raw_string_values/provider"
        }')[matrix.consumer] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache independent consumer build
        uses: Swatinem/rust-cache@v2
        with:
          key: service-${{ matrix.consumer }}
          workspaces: "${{ env.CONSUMER_DIRECTORY }} -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Clean independent consumer coverage artifacts
        working-directory: ${{ env.CONSUMER_DIRECTORY }}
        run: cargo llvm-cov clean --workspace

      - name: Collect consumer coverage
        id: collect
        working-directory: ${{ env.CONSUMER_DIRECTORY }}
        run: cargo llvm-cov --locked --no-report

      - name: Verify consumer line and full region coverage
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        working-directory: ${{ env.CONSUMER_DIRECTORY }}
        run: cargo llvm-cov report --summary-only --fail-under-lines 100 --fail-under-regions 100

      - name: Export coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        working-directory: ${{ env.CONSUMER_DIRECTORY }}
        env:
          COVERAGE_PACKAGES: default
        run: *coverage_diagnostics

      - name: Upload coverage diagnostics
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
              && inputs.diagnostics && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.consumer }}-${{ github.sha }}
          path: ${{ runner.temp }}/coverage-diagnostics
          if-no-files-found: error
          retention-days: 7
