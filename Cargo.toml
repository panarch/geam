[package]
name = "geam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Experimental Rust-embedded execution runtime for typed Gleam programs"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
keywords = ["gleam", "runtime", "interpreter", "embedded"]
categories = ["compilers", "development-tools"]
include = [
    "/assets/geam-mascot.svg",
    "/docs/**",
    "/examples/embedding/manual.rs",
    "/examples/embedding/manual/**",
    "/src/**",
    "/LICENSE",
    "/README.md",
]

[workspace]
members = [
    ".",
    "core",
    "cli",
    "builtins/stdlib",
    "builtins/json",
    "builtins/time",
    "macros",
]
default-members = [
    ".",
    "core",
    "cli",
    "builtins/stdlib",
    "builtins/json",
    "builtins/time",
    "macros",
]
resolver = "3"

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/panarch/geam"

[workspace.dependencies]
base64 = "0.22"
bitvec = "1.1.1"
camino = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
# Keep this aligned with the Gleam v1.18.1 dependency graph. geam-gleam-core
# does not compile against ecow 0.3.0.
ecow = "=0.2.6"
flate2 = "1"
geam-core = { path = "core", version = "=0.2.3" }
geam-cli = { path = "cli", version = "=0.2.3" }
geam-json = { path = "builtins/json", version = "=0.2.3" }
geam-macros = { path = "macros", version = "=0.2.3" }
geam-stdlib = { path = "builtins/stdlib", version = "=0.2.3" }
geam-time = { path = "builtins/time", version = "=0.2.3" }
gleam-core = { package = "geam-gleam-core", version = "=1.18.1-geam.2" }
gleam-compiler-core = { package = "geam-gleam-core", version = "=1.18.1-geam.2" }
half = { version = "2.7.1", default-features = false }
hex = "0.4"
hexpm = { package = "geam-gleam-hexpm", version = "=1.18.1-geam.2" }
im = "15"
jiff = "0.2.35"
jiter = { version = "0.16", default-features = false }
miette = "7"
num-bigint = "0.4.6"
num-traits = "0.2"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
rand = { version = "=0.10.2", default-features = false, features = ["std", "chacha", "sys_rng"] }
ryu = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.9"
toml_edit = "0.25"
trybuild = "1"
syn = { version = "2", features = ["full"] }
unicode-segmentation = "1.13"
ureq = { version = "3", features = ["json"] }
vec1 = "1"

[features]
default = ["full"]
full = ["cli", "embedding", "provider", "builtins"]
cli = ["dep:geam-cli"]
embedding = []
provider = ["dep:geam-macros"]
builtins = ["gleam-stdlib", "gleam-json", "gleam-time"]
gleam-stdlib = ["dep:geam-stdlib"]
gleam-json = ["dep:geam-json", "gleam-stdlib"]
gleam-time = ["dep:geam-time", "gleam-stdlib"]

[dependencies]
geam-cli = { workspace = true, optional = true }
geam-core.workspace = true
geam-json = { workspace = true, optional = true }
geam-macros = { workspace = true, optional = true }
geam-stdlib = { workspace = true, optional = true }
geam-time = { workspace = true, optional = true }

[[bin]]
name = "geam"
path = "src/bin/geam.rs"
required-features = ["cli"]

[[example]]
name = "rust_embedding"
path = "examples/embedding/manual.rs"
required-features = ["embedding"]

[[test]]
name = "binary"
path = "tests/binary.rs"
required-features = ["cli"]

[[test]]
name = "cross_crate_http"
path = "tests/cross_crate_http.rs"
required-features = ["gleam-stdlib"]

[[test]]
name = "provider_examples"
path = "tests/provider_examples.rs"
required-features = ["cli"]

[[test]]
name = "standalone_distribution"
path = "tests/standalone_distribution.rs"
required-features = ["cli"]

[dev-dependencies]
camino.workspace = true
ecow.workspace = true
gleam-core.workspace = true
miette = { workspace = true, features = ["fancy-no-backtrace"] }
num-bigint.workspace = true
tempfile.workspace = true
toml.workspace = true
