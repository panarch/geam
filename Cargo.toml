[package]
name = "geam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Experimental Rust-embedded execution runtime for typed Gleam programs"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]
keywords = ["gleam", "runtime", "interpreter", "embedded"]
categories = ["compilers", "development-tools"]
include = [
    "/assets/geam-mascot.svg",
    "/docs/**",
    "/src/**",
    "/LICENSE",
    "/README.md",
]

[workspace]
members = ["."]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/panarch/geam"

[workspace.dependencies]
base64 = "0.22"
bitvec = "1.1.1"
camino = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
# Keep this aligned with the Gleam v1.18.1 dependency graph. geam-gleam-core
# does not compile against ecow 0.3.0.
ecow = "=0.2.6"
flate2 = "1"
gleam-core = { package = "geam-gleam-core", version = "=1.18.1-geam.2" }
half = { version = "2.7.1", default-features = false }
hex = "0.4"
hexpm = { package = "geam-gleam-hexpm", version = "=1.18.1-geam.2" }
im = "15"
jiff = "0.2.35"
jiter = { version = "0.16", default-features = false }
miette = "7"
num-bigint = "0.4.6"
num-traits = "0.2"
rand = { version = "=0.10.0", default-features = false, features = ["std", "chacha", "sys_rng"] }
ryu = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.9"
unicode-segmentation = "1.13"
ureq = { version = "3", features = ["json"] }
vec1 = "1"

[dependencies]
base64.workspace = true
bitvec.workspace = true
camino.workspace = true
cargo_metadata.workspace = true
clap.workspace = true
ecow.workspace = true
flate2.workspace = true
gleam-core.workspace = true
half.workspace = true
hex.workspace = true
hexpm.workspace = true
im.workspace = true
jiff.workspace = true
jiter.workspace = true
miette.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
rand.workspace = true
ryu.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
ureq.workspace = true
vec1.workspace = true

[dev-dependencies]
miette = { workspace = true, features = ["fancy-no-backtrace"] }
