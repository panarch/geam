[package]
name = "geam"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
bitvec = "1.1.1"
camino = "1"
# Keep this aligned with the Gleam v1.17.0 dependency graph. gleam-core does not
# compile against ecow 0.3.0.
ecow = "=0.2.6"
gleam-core = { git = "https://github.com/gleam-lang/gleam", rev = "afc1b7d956b433e638d52dbd06470f53a0b26f6a", package = "gleam-core" }
half = { version = "2.7.1", default-features = false }
hex = "0.4"
im = "15"
miette = "7"
num-bigint = "0.4.6"
num-traits = "0.2"
rand = { version = "=0.10.0", default-features = false, features = ["std", "chacha", "sys_rng"] }
thiserror = "2"
toml = "0.9"
unicode-segmentation = "1.13"
vec1 = "1"

[dev-dependencies]
miette = { version = "7", features = ["fancy-no-backtrace"] }
tempfile = "3"
