[package]
name = "geam-example-text-pattern"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Documentation-oriented regex provider for Geam"
license = "Apache-2.0"
repository = "https://github.com/panarch/geam"
readme = "README.md"
publish = ["crates-io"]
keywords = ["geam", "gleam", "regex", "provider"]
categories = ["development-tools", "text-processing"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "example_text_pattern"
gleam-version = "0.1.0"

[dependencies]
geam = { version = "=0.2.1", default-features = false, features = ["provider"] }
regex = "1.12"

[workspace]
resolver = "3"
