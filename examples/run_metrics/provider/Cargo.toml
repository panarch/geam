[package]
name = "geam-example-run-metrics"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Documentation-oriented persistent metrics value provider for Geam"
license = "Apache-2.0"
repository = "https://github.com/panarch/geam"
readme = "README.md"
publish = ["crates-io"]
keywords = ["geam", "gleam", "metrics", "provider"]
categories = ["development-tools"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "example_run_metrics"
gleam-version = ">= 1.0.0 and < 2.0.0"

[dependencies]
geam = { version = "=0.2.1", default-features = false, features = ["provider"] }

[workspace]
resolver = "3"
