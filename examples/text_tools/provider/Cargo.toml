[package]
name = "geam-example-text-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Documentation-oriented multi-module text provider for Geam"
license = "Apache-2.0"
repository = "https://github.com/panarch/geam"
readme = "README.md"
publish = ["crates-io"]
keywords = ["geam", "gleam", "provider", "example"]
categories = ["development-tools"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "example_text_tools"
gleam-version = ">= 1.0.0 and < 2.0.0"

[dependencies]
ecow = "=0.2.6"
geam = { version = "=0.2.1", default-features = false, features = ["provider"] }

[workspace]
resolver = "3"
