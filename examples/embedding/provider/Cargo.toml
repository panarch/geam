[package]
name = "geam-rust-embedding-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
geam = { version = "=0.2.2", default-features = false, features = ["embedding"] }
patterns = { package = "geam-example-text-pattern", path = "../../provider/text_pattern/provider" }

[patch.crates-io]
geam = { path = "../../.." }

[workspace]
resolver = "3"
