[package]
name = "geam-rust-embedding-async-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
futures = "0.3"
geam = { version = "=0.2.3", default-features = false, features = ["embedding"] }

[patch.crates-io]
geam = { path = "../../.." }

[workspace]
resolver = "3"
