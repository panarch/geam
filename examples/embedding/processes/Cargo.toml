[package]
name = "geam-rust-embedding-processes"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
geam = { version = "=0.2.3", default-features = false, features = ["embedding", "gleam-erlang", "geam-builtin", "tokio", "gleam-stdlib"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[patch.crates-io]
geam = { path = "../../.." }

[workspace]
resolver = "3"
